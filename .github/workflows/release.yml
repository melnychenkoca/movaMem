name: Release

# Publishes a universal movaMem.app as a release asset when a version tag is
# pushed. The Homebrew cask points at that asset, so the tag is what drives a
# user-visible release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
on:
  push:
    tags:
      - "v*"
  # Allows a dry run against a branch without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macOS 15 runners are Apple Silicon. The build cross-compiles both slices,
    # so the runner architecture does not limit what ships.
    runs-on: macos-15

    # Job-level so the tap steps can test for the token in their `if:`. The
    # secrets context is not available in a conditional, and a step's own env
    # block is not documented as visible to its own `if:`, so it must live here.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Check the tag matches the app version
        # Info.plist is the single source of truth for the version. Without this
        # check a tag can ship an app that reports a different version than
        # Homebrew recorded, and `brew upgrade` then misjudges what is current.
        # Failing here costs a re-tag; failing silently ships a bad release.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Info.plist: $plist_version"
          echo "Tag:        $tag_version"
          if [ "$plist_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version does not match CFBundleShortVersionString $plist_version. Bump Resources/Info.plist, or re-tag to match it."
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Build universal app and zip
        run: make dist

      - name: Verify the asset is universal and correctly signed
        # A broken signature or a missing architecture is invisible until a user
        # downloads it, so fail the release here instead.
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          ditto -x -k movaMem.zip verify
          codesign --verify --deep --strict --verbose=2 verify/movaMem.app
          archs=$(lipo -archs verify/movaMem.app/Contents/MacOS/movaMem)
          echo "Architectures: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::Expected a universal binary, got: $archs"; exit 1 ;;
          esac

      - name: Record the checksum
        id: checksum
        # The cask needs this value. It is also printed in the job log and the
        # release notes so it can be copied without downloading the asset.
        run: |
          set -euo pipefail
          sha256=$(shasum -a 256 movaMem.zip | awk '{print $1}')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $sha256"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: movaMem.zip
          generate_release_notes: true
          body: |
            movaMem ${{ github.ref_name }} — universal build for Apple Silicon and Intel, macOS 14+.

            ## Install

            ```bash
            brew tap melnychenkoca/movamem
            brew trust --cask melnychenkoca/movamem/movamem
            brew install --cask movamem
            xattr -dr com.apple.quarantine /Applications/movaMem.app
            ```

            `brew trust` is required because Homebrew 5 does not load casks from
            third-party taps until they are trusted. The `xattr` step is required
            because this build is ad-hoc signed rather than notarized, so macOS
            otherwise reports it as "damaged". See the README for the
            System Settings alternative.

            ## Cask checksum

            ```
            sha256 "${{ steps.checksum.outputs.sha256 }}"
            ```

      # --- Update the Homebrew tap ---------------------------------------
      # Needs a token with contents:write on the tap repo, because the default
      # GITHUB_TOKEN is scoped to this repository only. If the secret is absent
      # the release still succeeds and the cask is updated by hand — see README.

      - name: Check out the tap
        if: startsWith(github.ref, 'refs/tags/') && env.TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: melnychenkoca/homebrew-movamem
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Point the cask at this release
        if: startsWith(github.ref, 'refs/tags/') && env.TAP_TOKEN != ''
        env:
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          BOT_NAME: github-actions[bot]
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          cask=tap/Casks/movamem.rb

          # Rewrite only the two release-specific stanzas, anchored to the start
          # of the line so the url's "v#{version}" interpolation is untouched.
          /usr/bin/sed -i '' -E \
            -e "s|^  version \".*\"|  version \"${version}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            "$cask"

          # The placeholder comment describes a value that is now filled in by
          # this job, so drop it the first time through.
          /usr/bin/sed -i '' \
            -e '/# Replaced on each release with the checksum printed by/d' \
            -e '/# Until the first tag is pushed there is no asset to hash, so this is a/d' \
            -e '/# placeholder and `brew install` will fail on mismatch by design./d' \
            "$cask"

          echo "--- cask after update ---"
          head -12 "$cask"

          # Fail loudly rather than pushing a cask that still has a placeholder.
          if grep -q "REPLACE_WITH_RELEASE_SHA256" "$cask"; then
            echo "::error::sha256 was not substituted in the cask"
            exit 1
          fi

          cd tap
          if git diff --quiet; then
            echo "Cask already up to date; nothing to push."
            exit 0
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -am "movamem ${version}"
          git push
