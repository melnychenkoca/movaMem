name: Release

# Publishes a universal movaMem.app as a release asset when a version tag is
# pushed. The Homebrew cask points at that asset, so the tag is what drives a
# user-visible release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
on:
  push:
    tags:
      - "v*"
  # Allows a dry run against a branch without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macOS 15 runners are Apple Silicon. The build cross-compiles both slices,
    # so the runner architecture does not limit what ships.
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: make test

      - name: Build universal app and zip
        run: make dist

      - name: Verify the asset is universal and correctly signed
        # A broken signature or a missing architecture is invisible until a user
        # downloads it, so fail the release here instead.
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          ditto -x -k movaMem.zip verify
          codesign --verify --deep --strict --verbose=2 verify/movaMem.app
          archs=$(lipo -archs verify/movaMem.app/Contents/MacOS/movaMem)
          echo "Architectures: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::Expected a universal binary, got: $archs"; exit 1 ;;
          esac

      - name: Record the checksum
        id: checksum
        # The cask needs this value. It is also printed in the job log and the
        # release notes so it can be copied without downloading the asset.
        run: |
          set -euo pipefail
          sha256=$(shasum -a 256 movaMem.zip | awk '{print $1}')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $sha256"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: movaMem.zip
          generate_release_notes: true
          body: |
            movaMem ${{ github.ref_name }} — universal build for Apple Silicon and Intel, macOS 14+.

            ## Install

            ```bash
            brew tap melnychenkoca/movamem
            brew install --cask --no-quarantine movamem
            ```

            `--no-quarantine` is needed because this build is ad-hoc signed
            rather than notarized. Without it macOS reports the app as
            "damaged"; see the README for what that means and the alternative.

            ## Cask checksum

            ```
            sha256 "${{ steps.checksum.outputs.sha256 }}"
            ```
